[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "config", "evaluation", "tests"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "src/dashboard/frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

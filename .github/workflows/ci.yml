name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check --fix . || true
          ruff check --select E,F --ignore E501,F401,F841 .

      - name: Run Pytest with Coverage Summary
        run: |
          pytest tests/ --cov=src --cov-report=term-missing

  frontend-ci:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/dashboard/frontend
        run: npm ci

      - name: Build React frontend app
        working-directory: src/dashboard/frontend
        run: npm run build

      - name: Lint frontend (if script exists)
        working-directory: src/dashboard/frontend
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script in package.json, skipping."
          fi
